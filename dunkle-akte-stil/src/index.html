<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dunkle Akte Renderer</title>
<style>
  @font-face { font-family: 'Anton'; src: url('/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Space Mono'; font-weight: 700; src: url('/node_modules/@fontsource/space-mono/files/space-mono-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 300; src: url('/node_modules/@fontsource/inter/files/inter-latin-300-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url('/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2') format('woff2'); }

  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  /* leichte Vignette wie im Original */
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 62% at 50% 46%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.5) 100%); }
  #black { position: absolute; inset: 0; background: #000; opacity: 0; }
  /* "FULL STORY"-Badge: oben links, rote Monospace-Schrift mit viel Sperrung auf dunklem Kasten */
  #badge { position: absolute; left: 58px; top: 146px; font-family: 'Space Mono'; font-weight: 700; font-size: 25px;
    letter-spacing: 0.3em; color: #e5332c; background: rgba(14, 14, 20, 0.80); padding: 11px 9px 11px 17px;
    border-radius: 5px; line-height: 1; }
  /* Untertitel: 1-3 Woerter, Versalien, Anton, weiss mit schwarzer Kontur, Schluesselwort rot */
  #cap { position: absolute; left: 30px; right: 30px; top: 1512px; text-align: center; font-family: 'Anton';
    font-size: 92px; line-height: 1.04; color: #fff; letter-spacing: 0.5px; white-space: nowrap;
    -webkit-text-stroke: 13px #000; paint-order: stroke fill;
    text-shadow: 0 5px 0 rgba(0,0,0,0.75), 0 0 22px rgba(0,0,0,0.55);
    transform-origin: 50% 50%; }
  #cap .r { color: #ec2f27; }
  /* Ende: "THE END" mittig, THE weiss, END rot */
  #theend { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: 'Anton';
    font-size: 210px; letter-spacing: 4px; color: #fff; opacity: 0; -webkit-text-stroke: 10px #000; paint-order: stroke fill; }
  #theend .r { color: #ec2f27; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
  <div id="cap"></div>
  <div id="black"></div>
  <div id="theend">THE <span class="r">END</span></div>
  <div id="badge">FULL STORY</div>
</div>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<script type="module" src="/render-page.js"></script>
</body>
</html>
