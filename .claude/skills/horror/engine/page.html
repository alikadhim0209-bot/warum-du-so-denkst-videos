<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'SS3B'; src: url('fonts/SourceSans3-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'SS3K'; src: url('fonts/SourceSans3-Black.ttf'); font-weight: 900; }
  @font-face { font-family: 'SCP';  src: url('fonts/SourceCodePro-Bold.ttf'); font-weight: 700; }
  html, body { margin: 0; padding: 0; width: 720px; height: 1280px; overflow: hidden; background: #000; }
  #stage { position: absolute; left: 0; top: 0; width: 720px; height: 1280px; }
  /* Karaoke-Untertitel – Source Sans 3 Bold 60px, Mitte bei y=1032 */
  #cap {
    position: absolute; left: 0; width: 720px; top: 1032px; transform: translateY(-50%);
    text-align: center; font-family: 'SS3B'; font-weight: 700; font-size: 60px; line-height: 1.05;
    white-space: nowrap; color: #fff; letter-spacing: 0.2px;
    text-shadow:
      0 0 2px rgba(0,0,0,.95),
      1.6px 1.6px 0 rgba(0,0,0,.8), -1.6px -1.6px 0 rgba(0,0,0,.8),
      1.6px -1.6px 0 rgba(0,0,0,.8), -1.6px 1.6px 0 rgba(0,0,0,.8),
      0 4px 10px rgba(0,0,0,.8);
  }
  #cap .up   { color: #d2d2d2; }
  #cap .done { color: #ffffff; }
  #cap .cur  { color: var(--accent, #fdd264); }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="cap"></div>
  <script src="lib/core.js"></script>
  <script src="lib/ui.js"></script>
  <script src="lib/fx.js"></script>
  <script src="lib/scenes.js"></script>
  <script src="lib/chars.js"></script>
  <script src="lib/monsters.js"></script>
  <script src="lib/legend.js"></script>
  <script src="lib/inserts.js"></script>
  <script>HE.init();</script>
</body>
</html>
